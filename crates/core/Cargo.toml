[package]
name = "family-archive-core"
description = "Safety-critical service layer for the Family Archive local photo catalogue."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "family_archive_core"
path = "src/lib.rs"

[dependencies]
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
blake3.workspace = true
image.workspace = true
kamadak-exif.workspace = true
aes-gcm.workspace = true
rand.workspace = true
thiserror.workspace = true
chrono.workspace = true
walkdir.workspace = true
fs2.workspace = true
hex.workspace = true
zeroize.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# security-framework gives us the real macOS Keychain. On other platforms we
# fall back to a file-wrapped dev keystore (see crypto::keystore).
security-framework = "2.11.0"

[dev-dependencies]
tempfile.workspace = true

[features]
default = []
# Enables tests that intentionally attempt a network connection to prove the
# network-isolation guard trips. Off by default so sandboxed CI stays hermetic.
network-guard-tests = []
